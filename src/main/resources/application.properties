spring.application.name=library-management-api
server.port=8080

# H2 in-memory – works in Docker/K8s (no files, no external DB)
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

library.loan-days=${LIBRARY_LOAN_DAYS:14}
info.app.name=Library Management API
info.app.version=${INFO_APP_VERSION:1.0.0}

